# Catalog of every skill in skills/ and of the upstream skills they rely on.
#
# skills.<name>:
#   kind: capability | role       A role is a router that equips an agent for a role.
#   roles: [role names]           Capability only: the roles whose routers use it.
#   status: unevaluated | evaluated   Evaluated means paired runs are recorded in evals/results/.
#
# Dependencies live in each SKILL.md as spec-compliant metadata strings:
#   metadata.requires: "name name"   Skills this one cannot work without.
#   metadata.handoffs: "name name"   Optional related skills.
#
# external.<provider>: skills kept upstream and installed from their source,
# so routers may name them without this repository copying them.
#
# Checked by scripts/check-catalog.py; install profiles are generated by
# scripts/build-profiles.py into catalog/profiles/.

roles:
  - agent-orchestrator
  - backend-engineer
  - frontend-engineer
  - mobile-engineer
  - ui-ux-designer
  - qa-engineer
  - devops-engineer
  - sysadmin
  - security-engineer
  - data-engineer
  - data-scientist
  - data-analyst
  - technical-writer
  - seo-engineer
  - business-analyst
  - financial-analyst
  - marketing-expert
  - copywriter

skills:
  clear-communication:
    kind: capability
    roles: [all]
    status: unevaluated
  project-guardrails:
    kind: capability
    roles: [agent-orchestrator, backend-engineer, frontend-engineer, mobile-engineer, qa-engineer, devops-engineer, sysadmin, security-engineer, data-engineer]
    status: unevaluated
  toolchain-upgrade:
    kind: capability
    roles: [backend-engineer, frontend-engineer, mobile-engineer, qa-engineer, devops-engineer, data-engineer]
    status: unevaluated
  correct:
    kind: capability
    roles: [agent-orchestrator, backend-engineer, frontend-engineer, mobile-engineer, qa-engineer, devops-engineer, data-engineer]
    status: unevaluated

  agent-orchestrator:
    kind: role
    status: unevaluated
  work-decomposition:
    kind: capability
    roles: [agent-orchestrator]
    status: unevaluated
  agent-briefing:
    kind: capability
    roles: [agent-orchestrator]
    status: unevaluated
  agent-debate:
    kind: capability
    roles: [agent-orchestrator]
    status: unevaluated
  result-verification:
    kind: capability
    roles: [agent-orchestrator]
    status: unevaluated
  decision-log:
    kind: capability
    roles: [agent-orchestrator]
    status: unevaluated

external:
  mattpocock-skills:
    source: https://github.com/mattpocock/skills
    install: Claude Code plugin mattpocock-skills from claude-plugins-official, or the skills CLI
    skills: [codebase-design, diagnosing-bugs, domain-modeling, grilling, prototype, research, tdd, writing-for-agents, wizard, handoff, retro]
  android-skills:
    source: https://github.com/android/skills
    install: skills CLI from the source repository
    skills: []
