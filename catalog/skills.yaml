# Catalog of every skill in skills/ and of the upstream skills they rely on.
#
# skills.<name>:
#   kind: capability | role       A role is a router that equips an agent for a role.
#   roles: [role names]           Capability only: the roles whose routers use it.
#   aliases: [search names]      Optional; search aliases never install another package.
#   invocation: model | user     Optional; model is the default.
#   status: unevaluated | evaluated   Evaluated means paired runs are recorded in evals/results/.
#
# Dependencies live in each SKILL.md as spec-compliant metadata strings:
#   metadata.requires: "name name"   Skills this one cannot work without.
# Optional routes are conditional prose pointers, not installation edges.
#
# external.<provider>: skills kept upstream and installed from their source,
# so routers may name them without this repository copying them.
#
# Checked by scripts/check-catalog.py; install profiles are generated by
# scripts/build-profiles.py into catalog/profiles/.

