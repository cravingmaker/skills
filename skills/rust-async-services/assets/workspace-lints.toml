# Comparison fragments for Cargo.toml; not a standalone Cargo manifest.
# No toolchain or dependency version is pinned; check the repo's toolchain docs.
# Merge into existing workspace tables; do not replace project policy.

[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"

