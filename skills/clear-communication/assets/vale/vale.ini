# Canonical Vale configuration for the ClearCommunication style.
# Copy this file and the ClearCommunication folder into a project to lint its docs.
StylesPath = .
MinAlertLevel = suggestion

# Quoted source material (blockquotes) and code stay exactly as written.
SkippedScopes = script, style, pre, figure, blockquote
IgnoredScopes = code, tt

[*.{md,txt}]
BasedOnStyles = ClearCommunication

# Opt-in: set to YES to flag every em dash.
ClearCommunication.EmDash = NO
